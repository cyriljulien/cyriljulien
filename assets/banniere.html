<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --fond: #f0ebe3; --encre: #2d2520; --doux: #6f645c; --accent: #d87d5d; --trait: rgba(45, 37, 32, 0.14); }
  html.sombre { --fond: #1c1a19; --encre: #edebe8; --doux: #a59d96; --accent: #e8926e; --trait: rgba(237, 235, 232, 0.14); }
  html, body { margin: 0; background: transparent; }
  .carte {
    box-sizing: border-box; width: 1280px; height: 360px; border-radius: 22px;
    background: var(--fond); color: var(--encre);
    padding: 54px 72px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .haut { display: flex; justify-content: space-between; align-items: center;
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--doux); }
  .haut .point { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 12px; vertical-align: 1px; }
  h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 400; font-size: 112px; line-height: 0.95; letter-spacing: -0.02em; margin: 0; }
  .bas { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--trait); padding-top: 22px; }
  .phrase { font-family: "EB Garamond", Georgia, serif; font-style: italic; font-size: 30px; color: var(--encre); }
  .phrase em { font-style: italic; color: var(--accent); }
  .lieux { font-family: "Inter", system-ui, sans-serif; font-size: 16px; color: var(--doux); letter-spacing: 0.01em; }
</style>
<script>if (location.hash === "#sombre") document.documentElement.classList.add("sombre");</script>
</head>
<body>
  <div class="carte">
    <div class="haut">
      <span><span class="point"></span>Développeur indépendant</span>
      <span>Provence, France</span>
    </div>
    <h1>Cyril Julien</h1>
    <div class="bas">
      <div class="phrase">Des sites qui <em>convertissent</em>, des logiciels qui servent.</div>
      <div class="lieux">Socium Web · Valyo</div>
    </div>
  </div>
</body>
</html>
